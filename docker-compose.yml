# A TINYBRAINS RUNNER. One container, and the only thing it needs to reach is a Soma.
#
#   cp .env.example .env                 # the Soma URL, RUNNER_KEY, the trust key and signatures
#   docker compose up -d                 # KALAM_IMAGE: the release this runner plays
#   docker compose up -d --build         # or this checkout, with KALAM_IMAGE=tinybrains/kalam:dev
#   docker compose --profile admit up -d # and the deployment's admitting runner beside it
#   docker compose logs -f
#
# WHAT IT DOES NOT CONTAIN IS THE WHOLE ARGUMENT. There is no database, no object store and no Soma.
# Everything a runner needs that is not on this machine, it asks Soma's gate for -- the match, the
# numbers it is played under, the URL to write the replay to -- and model bytes are a GET on a
# public-read bucket, re-hashed against the digest the gate named. If this file ever grows a service
# that is not a runner, a runner has stopped being something you can put on a desk.
#
# `admit` IS THE SAME RUNNER IN ITS OTHER ROLE, and only under `--profile admit`: the image, the key
# and every address are the runner's, and RUNNER_ROLE=admit makes it load tb-admit and nothing else.
# Soma runs no model, so admission waits until one of these is up somewhere -- one per deployment is
# enough, on whichever machine plays the fewest matches, and a second only shares the queue.
#
# WHAT THE OPERATOR COPIES FROM THE DEPLOYMENT. Three things:
#
#   RUNNER_KEY             minted on the admin Runners screen, shown once. Revoking it there stops
#                          this machine within one token lifetime (ten minutes).
#   TB_TRUST_PUBLIC_KEY    the deployment's plugin trust key, and its signatures directory -- the
#                          engine's signature belongs to whoever holds that key, so it can be in
#                          neither this image (shared by every deployment) nor this repository.
#   the addresses          Soma, the models bucket, and the blob endpoint Soma signs replay PUTs for.
#
# AGAINST web's LOCAL STACK every address is this machine's, reached as host.docker.internal: Soma
# on :8080, MinIO on :9000. .env.example carries that block, and RUNNER_ALLOW_PRIVATE_URLS=1, which
# a runner pointed at a real deployment must never set.
name: tinybrains-runner

services:
  runner:
    build:
      context: .
    # NO DEFAULT, ON PURPOSE. The image is the engine, and `:latest` is whatever was pulled last on
    # this machine -- a cached old one runs silently, claiming nothing because its engine is not the
    # one Soma declared. Name a release (`ghcr.io/tiny-brains/kalam:<version>`, then `up -d`), or
    # `tinybrains/kalam:dev` to build this checkout (`up -d --build`). `--build` tags the build with
    # this name, so never pair it with a release tag: the checkout would pass for the release.
    image: "${KALAM_IMAGE:?set KALAM_IMAGE in .env -- a release, ghcr.io/tiny-brains/kalam:<version>, or tinybrains/kalam:dev to build this checkout}"
    restart: unless-stopped

    # PID 1 is tini, which reaps the self-load fork and forwards SIGTERM to Orion unchanged, so a
    # draining match still gets its full shutdown_force_timeout_secs. docker/entrypoint.sh says why.
    init: true

    # host.docker.internal resolves on Docker Desktop by itself; this makes it resolve on Linux too,
    # where web's local stack publishes Soma and MinIO on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # The deployment's plugin signatures, copied onto this machine. Without them the engine fails
      # verification, the channels quarantine, and the self-load refuses to come up -- loudly, which
      # is the point. Against web's local stack this is that checkout's keys/signatures.
      - ${RUNNER_SIG_DIR:-./keys/signatures}:/sig:ro
      # The model cache: artifacts fetched by digest and kept between loads. A named volume, so a
      # restart does not re-download every model this runner plays. Size the Docker VM above
      # RUNNER_MAX_CACHE_BYTES + RUNNER_MAX_LOADED_BYTES.
      - runner-models:/var/lib/orion/models

    environment:
      # ---- what makes this machine a runner ------------------------------------------------
      RUNNER_KEY: ${RUNNER_KEY:?mint one on the Runners screen and put it in .env}
      RUNNER_LABEL: ${RUNNER_LABEL:-runner}
      # DERIVED from uname by the entrypoint unless set. Leave it unset: a hand-typed arch on the
      # Runners screen is a label that lies in exactly the situation the screen exists for.
      RUNNER_ARCH: ${RUNNER_ARCH:-}
      RUNNER_NODE_VERSION: ${RUNNER_NODE_VERSION:-dev}

      # ---- the platform, as seen from here -------------------------------------------------
      # SOMA. Every match statement this runner runs is a call to /v1/runner/* here.
      KALAM_API_URL: ${SOMA_URL:?the Soma this runner plays for, e.g. https://tinybrains.dev}
      # THE MODELS BUCKET, public-read, and the read-only key that signs the GET. Orion's `models`
      # entity must sign with something (`ArtifactRef` is {connector, key, digest} and has no URL
      # variant) and on a public bucket that something is not sensitive. The digest stays the
      # contract: every byte is re-hashed against what the roster declared.
      MODELS_BUCKET: ${MODELS_BUCKET:-tinybrains-models}
      MODELS_ENDPOINT: ${MODELS_ENDPOINT:?the models bucket's endpoint, as reached from this machine}
      MODELS_READ_ACCESS_KEY: ${MODELS_READ_ACCESS_KEY:?copy it from the deployment}
      MODELS_READ_SECRET_KEY: ${MODELS_READ_SECRET_KEY:?copy it from the deployment}
      # THE REPLAY BUCKET'S ADDRESS, AND IT IS NOT A CREDENTIAL. The runner never signs a replay PUT
      # -- it asks the gate, which answers a presigned URL and the endpoint it signed for. This is the
      # BASE of the connector that then makes that PUT, and it MUST EQUAL Soma's RUNNER_BLOB_ENDPOINT:
      # SigV4 signs the host, so a URL signed for one address and sent to another is
      # `SignatureDoesNotMatch`, a 403 that names neither setting.
      #
      # `kalam-blobs-put` names it directly, as `env://RUNNER_BLOB_ENDPOINT` -- the same name Soma
      # signs under, so the two settings that must be equal now share a name instead of being
      # renamed to R2_ENDPOINT on the way in. R2_ACCESS_KEY and R2_SECRET_KEY stay EMPTY, so
      # `kalam-blobs` -- the connector that would sign for itself -- has nothing to sign with. A
      # runner that could sign its own replay URL would be one the gate's claim-token check does
      # not bind.
      RUNNER_BLOB_ENDPOINT: ${RUNNER_BLOB_ENDPOINT:?the replay bucket endpoint Soma signs for}

      # ---- what this machine does NOT hold, which is the point ------------------------------
      #
      # PRESENT AND WELL-FORMED, NOT ABSENT AND NOT EMPTY, AND THE DIFFERENCE IS THE WHOLE NODE.
      # An unresolvable `env://` makes Orion SKIP that connector, and a WORKFLOW that references a
      # skipped connector CANNOT ACTIVATE -- `package apply` stops at it and the node exits.
      #
      # EMPTY USED TO BE ENOUGH; SINCE ORION 1.9.0 IT IS NOT. A connector's endpoint is scheme-checked
      # AFTER its references resolve, so `""` is now refused ("uses no scheme") exactly as `ftp://`
      # would be, and the connector is skipped again. These are therefore well-formed URLs that
      # route nowhere -- `.invalid` is reserved by RFC 2606 and never resolves -- so `kalam-db` and
      # `kalam-blobs` load, and are never reached: every task naming them is gated on `mode != "api"`.
      # ALL FIVE, because a connector needs EVERY `env://` it names. When the package's `db` branch
      # goes (CLAUDE.md, *Removing db mode*), these five lines go with it.
      KALAM_DB_URL: postgres://unused@db-mode-is-off.invalid/unused
      R2_ENDPOINT: http://db-mode-is-off.invalid
      R2_BUCKET: unused
      R2_ACCESS_KEY: unused
      R2_SECRET_KEY: unused

      # ---- how the package gets here -------------------------------------------------------
      PLUGIN_SIG_DIR: /sig
      # This node's OWN admin API, which the roster clock registers models through. `kalam-orion`
      # names it as `env://KALAM_ORION_ADMIN`, and that connector is the one always permitted a
      # private address -- it is this container calling itself.
      KALAM_ORION_ADMIN: ${KALAM_ORION_ADMIN:-http://127.0.0.1:8080/api/v1/admin}
      TB_TRUST_PUBLIC_KEY: ${TB_TRUST_PUBLIC_KEY:?copy it from the deployment}
      # THIS NODE'S OWN ADMIN PLANE, and nothing else's. It authorises the package load and the roster
      # clock's calls to 127.0.0.1, both of which stay on this machine. It is NOT the deployment's
      # admin key and must not be: generate one here.
      #   openssl rand -hex 32
      ORION_ADMIN_KEY: ${ORION_ADMIN_KEY:?generate one for this machine -- openssl rand -hex 32}
      ORION_ADMIN_BEARER: Bearer ${ORION_ADMIN_KEY}
      # EMPTY, AND THAT IS THE POSTURE. With this unset, `kalam-api`, `kalam-models` and
      # `kalam-blobs-put` refuse to resolve to a private address -- so a redirect, or a DNS answer,
      # that points this runner into a network behind it is refused rather than followed.
      # `kalam-orion` is exempt because it IS this node.
      #
      # SET IT ONLY AGAINST A LOCAL STACK, where every address is private by definition. That proves
      # everything except the one thing this variable is about, which is why web's scripts/check/configs.sh
      # refuses a runner that carries it with a public Soma URL.
      KALAM_ALLOW_PRIVATE_URLS: ${RUNNER_ALLOW_PRIVATE_URLS:-}

      ORION_VERSION: ${ORION_VERSION:-1.9.0}
      # A draining match is worth waiting for: it is a real result that is otherwise replayed from
      # scratch by whoever claims the row next.
      ORION_SHUTDOWN_DRAIN_SECS: ${RUNNER_SHUTDOWN_DRAIN_SECS:-5}
      ORION_SHUTDOWN_FORCE_SECS: ${RUNNER_SHUTDOWN_FORCE_SECS:-2700}
      ORION_CRON_SHUTDOWN_SECS: ${RUNNER_CRON_SHUTDOWN_SECS:-2700}
      RUNNER_CRON_WORKERS: ${RUNNER_CRON_WORKERS:-2}
      RUNNER_MAX_CACHE_BYTES: ${RUNNER_MAX_CACHE_BYTES:-4294967296}
      RUNNER_MAX_LOADED_BYTES: ${RUNNER_MAX_LOADED_BYTES:-2147483648}

    # Must exceed drain + force, or Docker SIGKILLs the drain and leaves rows `running` with a live
    # lease and no error anywhere -- a wedged match that only the reap clock will ever free.
    stop_grace_period: ${RUNNER_STOP_GRACE:-2760s}

    # LOOPBACK ONLY, and only because an operator may want to read /health or /metrics. A runner binds
    # no route, it makes calls. Publishing 8080 would publish this machine's admin plane. 8090 by
    # default, so a runner and web's local stack (Soma on 8080) fit on one machine.
    ports:
      - "127.0.0.1:${RUNNER_ADMIN_PORT:-8090}:8080"

    # The engine is wasm and the models are ONNX on CPU; both want cores more than anything else.
    # Left unset by default -- a dedicated machine should use what it has.
    deploy:
      resources:
        limits:
          cpus: ${RUNNER_CPUS:-0}
          memory: ${RUNNER_MEMORY:-0}

  # THE DEPLOYMENT'S ADMITTING RUNNER, off unless `--profile admit`. It claims one submission Soma's
  # admit clock prepared, admits and probes it on its own Orion, deletes it and reports -- no match
  # lane and no roster, so a match never waits on an admission and an admission is never timed under
  # a match's load on this node. Its own label, port and model cache (two Orions must not share one
  # cache directory), and a CPU ceiling so it cannot take the cores the match runner beside it plays
  # on. `!override` needs Compose 2.24 or later: ports are otherwise appended, not replaced.
  admit:
    extends: runner
    profiles: [admit]
    environment:
      RUNNER_ROLE: admit
      RUNNER_LABEL: ${RUNNER_LABEL:-runner}-admit
      # One admission is bounded by tb-admit's own ten minutes, so a stop waits for that and no more.
      ORION_SHUTDOWN_FORCE_SECS: "630"
      ORION_CRON_SHUTDOWN_SECS: "630"
    volumes:
      - admit-models:/var/lib/orion/models
    ports: !override
      - "127.0.0.1:${ADMIT_ADMIN_PORT:-8091}:8080"
    stop_grace_period: 660s
    deploy:
      resources:
        limits:
          cpus: ${ADMIT_CPUS:-2}
          memory: ${ADMIT_MEMORY:-0}

volumes:
  runner-models:
  admit-models:
