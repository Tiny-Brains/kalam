# A RELEASE IS A TAG: push `v<major>.<minor>.<patch>` from main and this publishes the runner image,
# for linux/amd64 and linux/arm64, as ghcr.io/tiny-brains/kalam:<version>, :<major>.<minor> and :latest.
#
#   gh workflow run release.yml          # REHEARSAL: both platforms built and checked, nothing pushed
#   git tag v0.1.0 && git push origin v0.1.0
#
# THE ANTS RELEASE IS CHOSEN ONCE, HERE. The image plays that release's engine, and a runner whose
# engine is not the one Soma declared claims nothing -- so the workflow resolves the latest release (or
# the repository variable ANTS_RELEASE, to pin one), passes it to the build, and records it and the
# engine digest on the image as labels.
#
# EVERY STAGE THAT BUILDS RUNS ON THE BUILD PLATFORM, so both images carry the same package and the
# same engine, and one signature verifies on both; only the runtime stage's apt-get runs per platform
# (amd64 under QEMU on this arm64 runner).
#
# A TAG IS NEVER RE-CUT: a runner pins the version, and a moved tag is a different engine under it.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A version tag on main
        if: github.ref_type == 'tag'
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::$GITHUB_REF_NAME is not v<major>.<minor>.<patch>"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: The ants release this image plays
        id: ants
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ vars.ANTS_RELEASE }}
        run: |
          tag="${PIN:-$(gh release view --repo Tiny-Brains/ants --json tagName --jq .tagName)}"
          echo "release=$tag" >> "$GITHUB_OUTPUT"
          echo "ants $tag"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build both platforms
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg ANTS_RELEASE=${{ steps.ants.outputs.release }} \
            --output "type=local,dest=$RUNNER_TEMP/out" .

      - name: Both platforms carry the same package and engine
        id: engine
        run: |
          cd "$RUNNER_TEMP/out"
          diff -r linux_amd64/pkg linux_arm64/pkg
          engine="sha256:$(sha256sum linux_arm64/pkg/kalam/plugins/tb-ants/tb-ants.wasm | cut -d' ' -f1)"
          echo "digest=$engine" >> "$GITHUB_OUTPUT"
          {
            echo "### kalam ${GITHUB_REF_NAME}"
            echo
            echo "ants \`${{ steps.ants.outputs.release }}\`, engine \`$engine\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tiny-brains/kalam
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: ANTS_RELEASE=${{ steps.ants.outputs.release }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            dev.tinybrains.ants.release=${{ steps.ants.outputs.release }}
            dev.tinybrains.ants.engine=${{ steps.engine.outputs.digest }}
